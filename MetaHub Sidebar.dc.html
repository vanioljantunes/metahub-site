   if(match) domVisible = true;\n          });\n          domSec.classList.toggle('hidden',!domVisible);\n          if(domVisible) rankVisible = true;\n        });\n        rankSec.classList.toggle('hidden',!rankVisible);\n        if(rankVisible) anyVisible = true;\n      });\n      var empty = document.getElementById('mraEmpty');\n      if(empty){\n        empty.style.display = (q && !anyVisible)?'block':'none';\n        var qEl = document.getElementById('mraEmptyQ');\n        if(qEl) qEl.textContent = q;\n      }\n    });\n  }\n\n  /* Mobile rank carousel (one rank at a time, swipe/arrows to switch) */\n  (function(){\n    var idx=0;\n    var lbl=document.getElementById('mraRsLabel');\n    function nm(r){var R=RANKS[r];return R?(R.name+' · '+R.sub):'MetaRank '+r;}\n    function apply(){\n      document.querySelectorAll('.mra-rank-section').forEach(function(s){\n        s.classList.toggle('mob-active', String(s.dataset.rid)===String(idx+1));\n      });\n      if(lbl) lbl.textContent=nm(idx+1);\n    }\n    var pv=document.getElementById('mraRsPrev'), nx=document.getElementById('mraRsNext');\n    if(pv)pv.addEventListener('click',function(){idx=(idx+3)%4;apply();});\n    if(nx)nx.addEventListener('click',function(){idx=(idx+1)%4;apply();});\n    var c=document.getElementById('mraContent'), sx=0;\n    if(c){\n      c.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});\n      c.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){idx=(dx<0?(idx+1)%4:(idx+3)%4);apply();}},{passive:true});\n    }\n    apply();\n  })();\n})();\n\n/* ── MetaRank Assessment ── */\n(function(){\n\n/* ── Domain definitions ── */\nvar DOMAINS = [\n  {key:'VIABILIDADE',name:'Viability Assessment',\n   desc:'Evaluating research ideas and meta-analysis feasibility',\n   questions:[\n     'Do you know how to assess the viability of an idea without a previous meta-analysis?',\n     'Do you know how to assess the viability of an idea with a previous meta-analysis?',\n     'Do you know how to assess the viability of an idea exploring subgroup analyses?',\n     'Do you know how to assess the viability of an idea with meta-regressions?'\n   ]\n  },\n  {key:'ESTAT_BASICA',name:'Basic Statistics',\n   desc:'Fundamental statistical methods in meta-analysis',\n   questions:[\n     'Do you know how to run binary outcomes and continuous outcomes in R?',\n     'Do you know how to run leave-one-out analyses in R?',\n     'Do you know how to run subgroup analyses in R?',\n     'Do you know how to deal with data only presented as median/IQR or median/SD?'\n   ]\n  },\n  {key:'ESTAT_AVANCADA',name:'Advanced Statistics',\n   desc:'Complex statistical techniques and methodologies',\n   questions:[\n     'Do you know how to run and assess meta regression analyses in R?',\n     'Do you know how to run and assess publication bias?',\n     'Do you know how to deal with cross-over trials?',\n     'Do you feel safe dealing with missing standard deviations?'\n   ]\n  },\n  {key:'OUTRAS_MA',name:'Other Meta-analyses',\n   desc:'Specialized meta-analysis types beyond standard approaches',\n   questions:[\n     'Do you know how to perform and interpret a diagnostic meta-analysis?',\n     'Do you know how to perform and interpret a network meta-analysis?',\n     'Do you know how to perform and interpret a study with only a systematic review without meta-analysis?',\n     'Do you know how to perform and interpret a single arm meta-analysis?'\n   ]\n  },\n  {key:'ESCRITA',name:'Writing & Communication',\n   desc:'Scientific writing and presentation skills',\n   questions:[\n     'Do you know the essential parts of an abstract?',\n     'Do you know how to write the introduction, methods and results?',\n     'Do you know how to elaborate a poster and present it?',\n     'Do you feel comfortable writing a proper discussion instead of just repeating your results?'\n   ]\n  }\n];\n\nvar RANK_INFO = {\n  1:{name:'Rookie',title:'META RANK 1',cardClass:'',\n     numColor:'rgba(218,148,32,.95)',\n     shadow:'inset 0 0 40px rgba(196,100,24,.2),0 0 0 2.5px rgba(218,148,32,.7),0 0 0 5.5px rgba(38,10,1,.65),0 0 0 8px rgba(188,92,18,.5),0 0 0 11px rgba(65,18,2,.4),0 20px 55px -8px rgba(176,94,20,.58),0 8px 24px -8px rgba(120,55,10,.62),0 0 60px rgba(196,100,24,.22)',\n     desc:'You\\'re beginning your meta-analysis journey. The MetaHub has a curated path to build your skills from the ground up, step by step.'},\n  2:{name:'Junior',title:'META RANK 2',cardClass:'card-silver',\n     numColor:'rgba(185,215,250,.95)',\n     shadow:'inset 0 0 40px rgba(120,160,210,.15),0 0 0 2.5px rgba(160,200,240,.68),0 0 0 5.5px rgba(15,25,65,.62),0 0 0 8px rgba(100,145,210,.48),0 0 0 11px rgba(25,40,90,.4),0 20px 55px -8px rgba(140,165,200,.45),0 8px 24px -8px rgba(80,100,130,.5),0 0 60px rgba(120,170,230,.18)',\n     desc:'You have foundational knowledge. Focus on strengthening your statistical methods and expanding your meta-analysis repertoire.'},\n  3:{name:'Senior',title:'META RANK 3',cardClass:'card-gold',\n     numColor:'rgba(240,200,40,.98)',\n     shadow:'inset 0 0 40px rgba(210,165,20,.18),0 0 0 2.5px rgba(240,200,40,.7),0 0 0 5.5px rgba(48,32,0,.62),0 0 0 8px rgba(210,165,20,.48),0 0 0 11px rgba(75,52,0,.4),0 20px 55px -8px rgba(200,160,20,.55),0 8px 24px -8px rgba(150,110,0,.6),0 0 60px rgba(210,165,20,.2)',\n     desc:'You\\'re proficient in most meta-analysis techniques. Refine your advanced statistical skills and scientific communication.'},\n  4:{name:'Master',title:'META RANK 4',cardClass:'card-diamond',\n     numColor:'rgba(160,230,255,.98)',\n     shadow:'inset 0 0 40px rgba(80,180,255,.15),0 0 0 2.5px rgba(100,200,255,.68),0 0 0 5.5px rgba(10,18,62,.62),0 0 0 8px rgba(80,160,255,.48),0 0 0 11px rgba(20,28,100,.4),0 20px 55px -8px rgba(100,200,255,.45),0 8px 24px -8px rgba(140,100,255,.4),0 0 60px rgba(100,200,255,.2)',\n     desc:'Exceptional mastery across all domains. You have reached the top of the MetaHub hierarchy — the pinnacle of methodological expertise.'}\n};\n\n/* ── Glow for sprite coin (replaces CSS ring box-shadows) ── */\nfunction spriteGlow(cardClass){\n  return {\n    'card-bronze':'0 0 30px rgba(196,100,24,.55),0 0 60px rgba(218,148,32,.2),0 8px 28px rgba(0,0,0,.6)',\n    'card-silver':'0 0 30px rgba(140,175,215,.5),0 0 60px rgba(160,200,240,.2),0 8px 28px rgba(0,0,0,.6)',\n    'card-gold'  :'0 0 30px rgba(210,170,20,.55),0 0 60px rgba(240,200,40,.2),0 8px 28px rgba(0,0,0,.6)',\n    'card-diamond':'0 0 30px rgba(80,180,255,.52),0 0 60px rgba(100,200,255,.22),0 8px 28px rgba(0,0,0,.6)',\n  }[cardClass]||'0 0 20px rgba(255,255,255,.1)';\n}\n\n/* ── Card inner HTML builder — sprite-based ── */\n/* Coin x-centers in original 1222×864 image: [164.5, 465.3, 762.3, 1061.0].\n   All ranks use 880px display width (ring diameter ≈ 200px at this scale).\n   Rank 1 needs an extra -12px left nudge because its actual center in the\n   Gemini image is slightly right of the assumed 164.5px coordinate. */\nfunction buildCardHTML(cardClass,rankNum,rankName){\n  var classToIdx={'card-bronze':0,'card-silver':1,'card-gold':2,'card-diamond':3};\n  var idx=classToIdx[cardClass]||0;\n  var coinCenters=[164.5,465.3,762.3,1061.0];\n  var w=880, scale=w/1222;\n  var leftNudge=[-4,0,0,0];\n  var left=Math.round(-(coinCenters[idx]*scale-100))+leftNudge[idx];\n  var top=Math.round(-(864*scale*0.501-100));\n  return '<img src=\"assets/hero.png\"'\n    +' style=\"position:absolute;width:'+w+'px;height:auto;max-width:none;'\n    +'left:'+left+'px;top:'+top+'px;\" alt=\"\" draggable=\"false\">';\n}\n\n/* ── State ── */\nvar state = {\n  currentDomain:0,\n  answers:[[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]]\n};\n\nfunction countAnswered(){\n  return state.answers.reduce(function(acc,da){\n    return acc+da.filter(function(a){return a!==null;}).length;\n  },0);\n}\n\nfunction scoreDomain(di){\n  var yes=state.answers[di].filter(function(a){return a==='yes';}).length;\n  if(yes===4)return 3;\n  if(yes===3)return 2;\n  if(yes===2)return 1;\n  return 0;\n}\n\nfunction computeRank(){\n  var sum=0;\n  for(var i=0;i<5;i++)sum+=scoreDomain(i)+1;\n  if(sum===5)return 1;\n  if(sum<=10)return 2;\n  if(sum<=15)return 3;\n  return 4;\n}\n\n/* ── Render stepper ── */\nfunction renderStepper(){\n  var el=document.getElementById('assessStepper');\n  if(!el)return;\n  var html='';\n  DOMAINS.forEach(function(d,i){\n    var isDone=i<state.currentDomain;\n    var isActive=i===state.currentDomain;\n    var cls='assess-step'+(isDone?' done':isActive?' active':'');\n    var chk='<svg viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 6l3 3 5-5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>';\n    html+='<div class=\"'+cls+'\">';\n    if(i>0)html+='<div class=\"assess-step-line\"></div>';\n    html+='<div class=\"assess-step-dot\">'+(isDone?chk:'')+'</div>';\n    html+='<span class=\"assess-step-lbl\">'+d.name.split(' ')[0]+'</span>';\n    html+='</div>';\n  });\n  el.innerHTML=html;\n}\n\n/* ── Render domain + questions ── */\nfunction renderDomain(){\n  var d=DOMAINS[state.currentDomain];\n  var numEl=document.getElementById('assessDomainNum');\n  var nameEl=document.getElementById('assessDomainName');\n  var descEl=document.getElementById('assessDomainDesc');\n  if(numEl)numEl.textContent='DOMAIN '+(state.currentDomain+1)+' OF 5';\n  if(nameEl)nameEl.textContent=d.name;\n  if(descEl)descEl.textContent=d.desc;\n}\n\nfunction renderQuestions(){\n  var el=document.getElementById('assessQuestions');\n  if(!el)return;\n  var d=DOMAINS[state.currentDomain];\n  var cur=state.answers[state.currentDomain];\n  var html='';\n  d.questions.forEach(function(q,qi){\n    var answered=cur[qi]!==null;\n    html+='<div class=\"assess-q'+(answered?' answered':'')+'\">'\n      +'<div class=\"assess-q-num\">'+(qi+1)+'.</div>'\n      +'<div class=\"assess-q-text\">'+q+'</div>'\n      +'<div class=\"assess-q-opts\">'\n      +['yes','maybe','no'].map(function(opt){\n        var sel=cur[qi]===opt?' sel-'+opt:'';\n        var lbl=opt==='yes'?'Yes':opt==='maybe'?'Maybe':'No';\n        return '<button class=\"assess-opt'+sel+'\" onclick=\"assessSelectAnswer('+state.currentDomain+','+qi+',\\''+opt+'\\')\">'+lbl+'</button>';\n      }).join('')\n      +'</div></div>';\n  });\n  el.innerHTML=html;\n}\n\nfunction updateCount(){\n  var el=document.getElementById('assessAnsweredCount');\n  if(el)el.textContent=countAnswered();\n}\n\nfunction updateNavBtns(){\n  var back=document.getElementById('assessBackBtn');\n  var next=document.getElementById('assessNextBtn');\n  if(back)back.disabled=(state.currentDomain===0);\n  if(next){\n    var isLast=state.currentDomain===4;\n    next.innerHTML=(isLast?'View Results':'Next')\n      +' <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:14px;height:14px;\"><polyline points=\"9 6 15 12 9 18\"/></svg>';\n  }\n}\n\nfunction renderAll(){\n  renderStepper();\n  renderDomain();\n  renderQuestions();\n  updateCount();\n  updateNavBtns();\n  /* scroll body to top on domain change */\n  var body=document.getElementById('assessBody');\n  if(body)body.scrollTop=0;\n}\n\n/* ── Public answer handler ── */\nwindow.assessSelectAnswer=function(di,qi,val){\n  state.answers[di][qi]=val;\n  renderQuestions();\n  updateCount();\n};\n\nwindow.assessPrev=function(){\n  if(state.currentDomain>0){state.currentDomain--;renderAll();}\n};\n\nwindow.assessNext=function(){\n  /* validate all questions on current page are answered */\n  var currentAnswers=state.answers[state.currentDomain];\n  var allAnswered=currentAnswers.every(function(a){return a!==null;});\n  if(!allAnswered){\n    /* highlight unanswered questions with shake */\n    var qEls=document.querySelectorAll('#assessQuestions .assess-q');\n    qEls.forEach(function(el,i){\n      if(currentAnswers[i]===null){\n        el.classList.remove('unanswered-error');\n        void el.offsetWidth; /* force reflow to restart animation */\n        el.classList.add('unanswered-error');\n        setTimeout(function(){el.classList.remove('unanswered-error');},500);\n      }\n    });\n    return;\n  }\n  if(state.currentDomain<4){state.currentDomain++;renderAll();}\n  else showResult();\n};\n\n/* ── Show result ── */\nfunction showResult(){\n  var rank=computeRank();\n  var info=RANK_INFO[rank];\n\n  /* persist */\n  localStorage.setItem('metaRankScore',rank);\n  localStorage.setItem('metaRankAnswers',JSON.stringify(state.answers));\n\n  /* populate result view */\n  var numEl=document.getElementById('resultRankNum');\n  var titleEl=document.getElementById('resultRankTitle');\n  var subEl=document.getElementById('resultRankSub');\n  if(numEl){numEl.textContent=info.title;numEl.style.color=info.numColor;}\n  if(titleEl)titleEl.textContent=info.name;\n  if(subEl)subEl.textContent=info.desc;\n\n  /* build result coin — sprite-based */\n  var card=document.getElementById('resultRankCard');\n  if(card){\n    card.className='rc-card rc-sprite '+(info.cardClass||'');\n    card.style.boxShadow=spriteGlow(info.cardClass||'');\n    card.innerHTML=buildCardHTML(info.cardClass||'',info.title,info.name);\n  }\n\n  /* switch views */\n  document.getElementById('assessFormView').classList.remove('av-active');\n  document.getElementById('assessResultView').classList.add('av-active');\n  document.getElementById('assessCloseBtn').style.display='none';\n\n  /* update hero badge */\n  updateHeroBadge(rank);\n}\n\nwindow.assessRetake=function(){\n  /* reset state */\n  state.currentDomain=0;\n  state.answers=[[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]];\n  document.getElementById('assessResultView').classList.remove('av-active');\n  document.getElementById('assessFormView').classList.add('av-active');\n  document.getElementById('assessCloseBtn').style.display='';\n  renderAll();\n};\n\n/* ── Hero badge ── */\nfunction updateHeroBadge(rank){\n  var emptyEl=document.getElementById('rcBadgeEmpty');\n  var insigniaEl=document.getElementById('rcInsigniaHero');\n  var discoverEl=document.getElementById('rcBadgeDiscoverText');\n  var retakeEl=document.getElementById('rcBadgeRetakeHint');\n  var rankLabelEl=document.getElementById('heroRankLabel');\n\n  if(rank){\n    var info=RANK_INFO[rank];\n    if(emptyEl)emptyEl.style.display='none';\n    if(discoverEl)discoverEl.style.display='none';\n    if(insigniaEl){\n      var MEDAL_SVG='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"6\"/><path d=\"M15.477 12.89 17 22l-5-3-5 3 1.523-9.11\"/></svg>';\n      insigniaEl.style.display='';\n      insigniaEl.style.boxShadow='';\n      insigniaEl.className='rc-card--filled medal-'+rank;\n      insigniaEl.innerHTML='<div class=\"rc-medal\">'+MEDAL_SVG+'</div>'\n        +'<div class=\"rc-rank-num\">'+rank+'</div>'\n        +'<div class=\"rc-rank-title\">'+info.name+'</div>';\n    }\n    if(retakeEl)retakeEl.style.display='flex';\n    if(rankLabelEl){\n      rankLabelEl.style.display='';\n      rankLabelEl.textContent='MetaRank '+rank;\n      rankLabelEl.style.color=info.numColor||'var(--cyan)';\n      rankLabelEl.style.textShadow='0 0 18px '+(info.numColor||'var(--cyan)')+',0 0 36px '+(info.numColor||'var(--cyan)');\n      setTimeout(function(){rankLabelEl.classList.add('visible');},40);\n    }\n  }else{\n    if(emptyEl)emptyEl.style.display='';\n    if(discoverEl)discoverEl.style.display='flex';\n    if(insigniaEl)insigniaEl.style.display='none';\n    if(retakeEl)retakeEl.style.display='none';\n    if(rankLabelEl){rankLabelEl.style.display='none';rankLabelEl.classList.remove('visible');}\n  }\n}\n\n/* ── Open / Close modal ── */\nwindow.openAssessModal=function(){\n  /* always reset to form start */\n  state.currentDomain=0;\n  state.answers=[[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]];\n  document.getElementById('assessFormView').classList.add('av-active');\n  document.getElementById('assessResultView').classList.remove('av-active');\n  document.getElementById('assessCloseBtn').style.display='';\n  renderAll();\n  var modal=document.getElementById('assessModal');\n  if(modal){modal.classList.add('open');document.body.style.overflow='hidden';}\n};\n\nwindow.closeAssessModal=function(){\n  var modal=document.getElementById('assessModal');\n  if(modal){modal.classList.remove('open');document.body.style.overflow='';}\n};\n\n/* ── Hover glow for result \"Understand MetaRanks\" btn ── */\n(function(){\n  var btn=document.querySelector('#assessResultView .newsletter-hover-btn');\n  var glow=document.getElementById('resultMetaranksGlow');\n  if(!btn||!glow)return;\n  btn.addEventListener('mousemove',function(e){\n    var r=btn.getBoundingClientRect();\n    glow.style.left=(e.clientX-r.left)+'px';\n    glow.style.top=(e.clientY-r.top)+'px';\n  });\n})();\n\n/* ── Init on load ── */\n(function(){\n  if(new URLSearchParams(location.search).get('reset')==='1'){\n    localStorage.removeItem('metaRankScore');\n    localStorage.removeItem('metaRankAnswers');\n    history.replaceState(null,'',location.pathname);\n  }\n  var saved=localStorage.getItem('metaRankScore');\n  updateHeroBadge(saved?parseInt(saved):null);\n  renderAll();\n  /* ESC closes assessment modal */\n  document.addEventListener('keydown',function(e){\n    if(e.key==='Escape')closeAssessModal();\n  });\n})();\n\n})(); /* end MetaRank Assessment IIFE */\n\n/* ── CosmicNebulaMastercard interaction (ported to vanilla JS) ── */\n(function(){\n  const card = document.getElementById('rcCard');\n  if (!card) return;\n\n  let hovered = false;\n  let raf;\n\n  card.addEventListener('mouseenter', function(){\n    hovered = true;\n    card.classList.add('no-anim');\n    card.style.transition = 'transform 80ms ease-out';\n  });\n\n  card.addEventListener('mousemove', function(e){\n    if (!hovered) return;\n    cancelAnimationFrame(raf);\n    raf = requestAnimationFrame(function(){\n      const r = card.getBoundingClientRect();\n      const cx = r.left + r.width  / 2;\n      const cy = r.top  + r.height / 2;\n      const angleX =  ((e.clientY - cy) / (r.height / 2)) * 50;\n      const angleY = -((e.clientX - cx) / (r.width  / 2)) * 50;\n      const angleZ  = Math.min(Math.abs(angleX) + Math.abs(angleY), 20) / 10;\n      card.style.transform =\n        'perspective(900px) rotateX('+angleX+'deg) rotateY('+angleY+'deg) rotateZ('+angleZ+'deg)';\n    });\n  });\n\n  card.addEventListener('mouseleave', function(){\n    hovered = false;\n    card.style.transition = 'transform 500ms cubic-bezier(.34,1.56,.64,1)';\n    card.style.transform = '';\n    /* re-enable CSS animation after spring settles */\n    setTimeout(function(){ card.classList.remove('no-anim'); card.style.transform=''; }, 520);\n  });\n})();\n/* ── MetaRank Modal ── */\nfunction openMetaRankModal(){\n  document.getElementById('mrModal').classList.add('open');\n  document.body.style.overflow='hidden';\n}\nfunction closeMetaRankModal(){\n  document.getElementById('mrModal').classList.remove('open');\n  document.body.style.overflow='';\n}\ndocument.addEventListener('keydown',function(e){if(e.key==='Escape')closeMetaRankModal();});\n\n/* ── MetaSolutions SPA Navigation ── */\nfunction openMsSolution(url, name){\n  var gridView = document.getElementById('msGridView');\n  var solView  = document.getElementById('msSolView');\n  var frame    = document.getElementById('msSolFrame');\n  var nameEl   = document.getElementById('msSolName');\n\n  nameEl.textContent = name;\n  frame.src = url;\n  gridView.style.display = 'none';\n  solView.classList.add('active');\n  solView.style.animation = 'msFadeIn .3s cubic-bezier(.22,1,.36,1) both';\n\n  /* Scroll so the section nav is at the top */\n  var secNav = document.querySelector('.sec-nav');\n  if(secNav){\n    var targetY = secNav.getBoundingClientRect().top + window.pageYOffset - ((document.querySelector('.mhnav')||{}).offsetHeight||0);\n    window.scrollTo({top: targetY, behavior: 'smooth'});\n  }\n}\n\nfunction closeMsSolution(){\n  var gridView = document.getElementById('msGridView');\n  var solView  = document.getElementById('msSolView');\n  var frame    = document.getElementById('msSolFrame');\n\n  solView.classList.remove('active');\n  frame.src = '';\n  gridView.style.display = '';\n}\n\nfunction openMcConnection(url, name){\n  var gridView = document.getElementById('mcGridView');\n  var solView  = document.getElementById('mcSolView');\n  var frame    = document.getElementById('mcSolFrame');\n  var nameEl   = document.getElementById('mcSolName');\n\n  nameEl.textContent = name;\n  frame.src = url;\n  gridView.style.display = 'none';\n  solView.classList.add('active');\n  solView.style.animation = 'msFadeIn .3s cubic-bezier(.22,1,.36,1) both';\n\n  var secNav = document.querySelector('.sec-nav');\n  if(secNav){\n    var targetY = secNav.getBoundingClientRect().top + window.pageYOffset - ((document.querySelector('.mhnav')||{}).offsetHeight||0);\n    window.scrollTo({top: targetY, behavior: 'smooth'});\n  }\n}\n\nfunction closeMcConnection(){\n  var gridView = document.getElementById('mcGridView');\n  var solView  = document.getElementById('mcSolView');\n  var frame    = document.getElementById('mcSolFrame');\n\n  solView.classList.remove('active');\n  frame.src = '';\n  gridView.style.display = '';\n}\n\n/* ── Class Streak ── */\n(function(){\n  /* cyan: #00d9b4 = rgb(0,217,180) */\n  function rnd(s){var x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);}\n  function dsStr(d){\n    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n  }\n\n  /* Deterministic sample lesson data */\n  var map={};\n  var today=new Date();\n  var d=new Date(today);d.setFullYear(d.getFullYear()-1);\n  var idx=0;\n  while(d<=today){\n    var vac=(idx>55&&idx<68)||(idx>200&&idx<215);\n    var dow=d.getDay();\n    var prob=vac?0:(dow===0||dow===6)?0.28:0.70;\n    if(rnd(idx*7+1)<prob){\n      var cnt=rnd(idx*7+2)<0.5?1:rnd(idx*7+3)<0.65?2:3;\n      map[dsStr(d)]=cnt;\n    }\n    d.setDate(d.getDate()+1);idx++;\n  }\n\n  /* Build calendar grid */\n  var calStart=new Date(today);\n  calStart.setDate(calStart.getDate()-364);\n  calStart.setDate(calStart.getDate()-calStart.getDay());\n\n  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n  var mHtml='',wHtml='',prevMon=-1;\n\n  for(var w=0;w<53;w++){\n    var ws=new Date(calStart);ws.setDate(calStart.getDate()+w*7);\n    var mlabel='';\n    if(ws.getMonth()!==prevMon){mlabel=MONTHS[ws.getMonth()];prevMon=ws.getMonth();}\n    mHtml+='<div class=\"streak-month-cell\">'+mlabel+'</div>';\n\n    wHtml+='<div class=\"streak-week-col\">';\n    for(var di=0;di<7;di++){\n      var day=new Date(ws);day.setDate(ws.getDate()+di);\n      var ds=dsStr(day);\n      var isFut=day>today;\n      var cnt=map[ds]||0;\n      var cls='streak-cell'+(isFut?' s-future':'');\n      var sty='',ttl='';\n      if(!isFut&&cnt){\n        var alpha=cnt===1?0.32:cnt===2?0.62:0.95;\n        sty='background:rgba(0,217,180,'+alpha+');border-color:rgba(0,217,180,.2);';\n        ttl='Dia estudado';\n      }\n      wHtml+='<div class=\"'+cls+'\" style=\"'+sty+'\" title=\"'+ttl+'\"></div>';\n    }\n    wHtml+='</div>';\n  }\n\n  var me=document.getElementById('streakMonths');\n  var we=document.getElementById('streakWeeks');\n  if(me)me.innerHTML=mHtml;\n  if(we)we.innerHTML=wHtml;\n\n  var scrollEl=document.getElementById('streakScroll');\n  if(scrollEl)requestAnimationFrame(function(){scrollEl.scrollLeft=scrollEl.scrollWidth;});\n})();\n\n\n;\n/* Switch section-nav panel programmatically (r
