<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;}
  *{box-sizing:border-box;}
</style>
</helmet>
<div style="min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;padding:34px 16px 48px;background:radial-gradient(120% 90% at 50% 0%,#0c1830 0%,#070a11 60%);font-family:'Outfit',sans-serif;">

  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;">
    <div style="font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#00d9b4;">Mobile preview</div>
    <div style="font-size:13px;color:rgba(212,222,238,.55);max-width:360px;line-height:1.5;">Live phone view of the MetaHub home — comment and mark directly on this frame.</div>
  </div>

  <!-- iPhone frame -->
  <div style="position:relative;width:392px;height:846px;flex-shrink:0;border-radius:60px;padding:13px;background:linear-gradient(150deg,#2a2f3a,#0d0f15 55%,#23262e);box-shadow:0 0 0 2px rgba(255,255,255,.05),0 40px 90px rgba(0,0,0,.6),inset 0 0 6px rgba(255,255,255,.08);">
    <div style="position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:#070a11;box-shadow:inset 0 0 0 2px rgba(0,0,0,.7);">
      <!-- dynamic island -->
      <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:33px;background:#000;border-radius:20px;z-index:20;pointer-events:none;"></div>
      <iframe src="MetaHub%20Home.dc.html" title="MetaHub mobile" style="width:100%;height:100%;border:0;display:block;background:#070a11;"></iframe>
    </div>
    <!-- side buttons -->
    <div style="position:absolute;left:-3px;top:150px;width:3px;height:30px;background:#1a1d24;border-radius:3px 0 0 3px;"></div>
    <div style="position:absolute;left:-3px;top:200px;width:3px;height:52px;background:#1a1d24;border-radius:3px 0 0 3px;"></div>
    <div style="position:absolute;left:-3px;top:268px;width:3px;height:52px;background:#1a1d24;border-radius:3px 0 0 3px;"></div>
    <div style="position:absolute;right:-3px;top:188px;width:3px;height:78px;background:#1a1d24;border-radius:0 3px 3px 0;"></div>
  </div>

</div>
</x-dc>
</body>
</html>
